name: Mein erster Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Tauri App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY}}
        
      - name: ssh vorbereiten  
        env: 
          SSH_PRIV: ${{secrets.HETZER_LOGIN}}
        run: 
          mkdir -p ~/.ssh 
          printf '%s\n' "$SSH_PRIV" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzer_deploy 
          
      - name: hetzer login 
        env:
          HETZNER_HOST: ${{ vars.HETZNER_HOST }}
          HETZNER_USER: ${{ vars.HETZNER_USER }}
        run: 
          ssh -i ~/.ssh/hetzner_deploy "$HETZER_USER@$HETZER_HOST" whoami
        
        
