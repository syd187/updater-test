name: Mein erster Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z. B. 0.2.3"
        required: true
        type: string

  push:
    tags:
      - "v*"

jobs:

  # ============================================================
  # MACOS BUILD
  # ============================================================

  build-macos:
    runs-on: macos-15

    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}

    steps:

      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Version ermitteln
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          VERSION="${VERSION#v}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version prüfen
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          echo "Workflow-Version: $VERSION"
          echo "Tauri-Version: $APP_VERSION"

          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Fehler: Versionen stimmen nicht überein."
            exit 1
          fi

      - name: Tauri Mac App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: latest.json erstellen
        run: node scripts/create-latest-json.js

      - name: SSH vorbereiten
        env:
          SSH_PRIV: ${{ secrets.HETZER_LOGIN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIV" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Hetzner Login testen
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            "$HETZNER_USER@$HETZNER_HOST" \
            "whoami"

      - name: Versionsordner erstellen
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            "$HETZNER_USER@$HETZNER_HOST" \
            "mkdir -p /var/www/html/updater/$VERSION"

      - name: DMG finden
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -type f | head -n 1)

          if [ -z "$DMG_PATH" ]; then
            echo "Fehler: Keine DMG gefunden."
            exit 1
          fi

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "DMG gefunden: $DMG_PATH"

      - name: Installationsordner erstellen
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
            "$HETZNER_USER@$HETZNER_HOST" \
            "mkdir -p /var/www/html/downloads/mac/$VERSION"

      - name: Mac Installationsdatei hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            "$DMG_PATH" \
            "$HETZNER_USER@$HETZNER_HOST:/var/www/html/downloads/mac/$VERSION/updater.dmg"

      - name: Aktuelle Mac Installationsdatei hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            "$DMG_PATH" \
            "$HETZNER_USER@$HETZNER_HOST:/var/www/html/downloads/mac/updater.dmg"

      - name: Updatepaket hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            src-tauri/target/release/bundle/macos/updater.app.tar.gz \
            "$HETZNER_USER@$HETZNER_HOST:/var/www/html/updater/$VERSION/updater.app.tar.gz"

      - name: Signatur hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            src-tauri/target/release/bundle/macos/updater.app.tar.gz.sig \
            "$HETZNER_USER@$HETZNER_HOST:/var/www/html/updater/$VERSION/updater.app.tar.gz.sig"

      - name: latest.json hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            latest.json \
            "$HETZNER_USER@$HETZNER_HOST:/var/www/html/updater/latest.json"


  # ============================================================
  # WINDOWS BUILD
  # ============================================================

  build-windows:
    runs-on: windows-latest

    steps:

      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Version ermitteln
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $VERSION = $env:MANUAL_VERSION
          }
          else {
            $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          }

          $VERSION = $VERSION -replace '^v', ''

          "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version prüfen
        shell: pwsh
        run: |
          $APP_VERSION = node -p "require('./src-tauri/tauri.conf.json').version"

          Write-Host "Workflow-Version: $env:VERSION"
          Write-Host "Tauri-Version: $APP_VERSION"

          if ($env:VERSION -ne $APP_VERSION) {
            Write-Error "Fehler: Versionen stimmen nicht überein."
            exit 1
          }

      - name: Tauri Windows App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Windows Build-Dateien anzeigen
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse

      - name: Windows Installer als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          overwrite: true
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
