
name: Mein erster Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z.b wo 0.2.3"
        required: true
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    
    
    env: 
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
    
    
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4
    
      - name: Version ermitteln
        env:
            MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
    
          VERSION="${VERSION#v}"
    
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    
    
      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
    
      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
    
      - name: Abhängigkeiten installieren
        run: npm ci
    
      - name: Version prüfen
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
      
          echo "Workflow-Version: $VERSION"
          echo "Tauri-Version: $APP_VERSION"
      
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Fehler: Versionen stimmen nicht überein."
            exit 1
          fi
    
      
      - name: Tauri App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY}}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD}}
        
      - name: SSH vorbereiten
        env:
          SSH_PRIV: ${{ secrets.HETZER_LOGIN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIV" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          ssh-keyscan -H 178.104.161.110 >> ~/.ssh/known_hosts
          
      - name: hetzner login 
        env:
          HETZNER_USER: ${{ vars.HETZNER_USER }}
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
          deploy-tester@178.104.161.110 \
          "whoami"
      
      - name: json erstellen 
        run: node scripts/create-latest-json.js 
    
      - name: Versionsordner erstellen 
        run: 
          ssh -i ~/.ssh/hetzner_deploy deploy-tester@178.104.161.110 "mkdir -p /var/www/html/updater/$VERSION" 


      - name: DMG finden
        run: |
          DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -type f | head -n 1)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Installationordner erstellen
        run: |
          ssh -i ~/.ssh/hetzner_deploy \
          deploy-tester@178.104.161.110 \
          mkdir -p "/var/www/html/downloads/mac/$VERSION"

      - name: Installationsdatei hochladen 
        run: |
          scp -i ~/.ssh/hetzner_deploy \
          "$DMG_PATH" \
          deploy-tester@178.104.161.110:/var/www/html/downloads/mac/$VERSION/updater.dmg
            
      - name: Updatepaket hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            src-tauri/target/release/bundle/macos/updater.app.tar.gz \
            deploy-tester@178.104.161.110:/var/www/html/updater/$VERSION/updater.app.tar.gz
            
      - name: Signatur hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            src-tauri/target/release/bundle/macos/updater.app.tar.gz.sig \
            deploy-tester@178.104.161.110:/var/www/html/updater/$VERSION/updater.app.tar.gz.sig
    
      - name: latest.json hochladen
        run: |
          scp -i ~/.ssh/hetzner_deploy \
            latest.json \
            deploy-tester@178.104.161.110:/var/www/html/updater/latest.json
    
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tauri Windows App bauen
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Windows Installer speichern
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
